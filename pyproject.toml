[tool.poetry]
name = "CryoJDM"
version = "0.1.0"
description = "CryoJDM: Self-Supervised Method for Joint Denoising and Missing Wedge Compensation in Cryo-Electron Tomography"
authors = ["anonymous <anonymous@example.com>"]
readme = "README.md"
homepage = "https://github.com/cryoetools/CryoJDM"
repository = "https://github.com/cryoetools/CryoJDM"
documentation = "https://CryoJDM.readthedocs.io"
keywords = ["CryoJDM"]
classifiers=[
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/cryoetools/CryoJDM/issues"

[tool.poetry.scripts]
cryojdm = 'cryojdm.cli:app'
cryojdm-gui = 'cryojdm.gui:launch_gui'


[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
priority = "primary"

[tool.poetry.dependencies]
python = "<3.11,>=3.10"
typer = {extras = ["all"], version = "^0.13.0"}
torch = "2.1.2"
torchvision = "0.16.2"
torchaudio = "2.1.2"
numpy = "1.25.0"
mrcfile = "^1.5.4"
pydata-sphinx-theme = "^0.16.1"
matplotlib = "^3.10.0"
scipy = "^1.15.2"
scikit-image = "^0.25.2"
pandas = "^2.2.3"
starfile = "^0.5.11"
monai = "^1.4.0"
omegaconf = "^2.3.0"
tqdm = "^4.67.1"
customtkinter = "^5.2.2"
pillow = ">=11.1,<13.0"
pytorch-lightning = "2.1"
dynamic-network-architectures = "^0.3.1"
hyperopt = "^0.2.7"
tensorboard = "^2.19.0"
bottleneck = "^1.4.2"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.0.1"
invoke = "^2.2.0"
bump2version = "^1.0.1"
watchdog = {version = "^6.0.0", extras = ["watchmedo"]}

[tool.poetry.group.test.dependencies]
pytest = "^8.3.3"
xdoctest = "^1.2.0"
coverage = {version = "^7.6.7", extras = ["toml"]}
pytest-cov = "^6.0.0"

[tool.poetry.group.linters.dependencies]
isort = "^5.13.2"
black = "^24.10.0"
ruff = "^0.7.4"

[tool.poetry.group.security.dependencies]
safety = "^3.2.11"

[tool.poetry.group.typing.dependencies]
mypy = "^1.13.0"

[tool.poetry.group.docs.dependencies]
sphinx = "^7.4.7"
recommonmark = "^0.7.1"

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["cryojdm"]

[tool.coverage.report]
fail_under = 1
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug",
  "if settings.DEBUG:",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == __main__:"
]
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
target-version = "py310"
output-format = "full"
line-length = 99
fix = true
extend-exclude = [
    "docs/*",
]

[tool.ruff.lint]
select = [
  "E", "F", "W",  # flake8
  "C",  # mccabe
  "I",  # isort
  "N",  # pep8-naming
  "D",  # flake8-docstrings
  "ANN",  # flake8-annotations
  "S",  # flake8-bandit
  "BLE",  # flake8-blind-except
  "B",  # flake8-bugbear
  "A",  # flake8-builtins
  "G",  # flake8-logging-format
  "ERA",  # eradicate
  "ISC",  # flake8-implicit-str-concat
  "RUF",  # Ruff-specific rules
]
ignore = ["ANN101"]
unfixable = [
  "ERA",  # Don't remove commented-out code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["cryojdm"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 99
known_third_party = ["invoke", "nox", "nox_poetry"]

[tool.black]
line-length = 99
target-version = ["py310"]

[tool.mypy]
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = ['^src/cryojdm/third_party/.*']

[[tool.mypy.overrides]]
module = ["pytest.*", "invoke.*", "nox.*", "nox_poetry.*"]
allow_redefinition = false
check_untyped_defs = true
ignore_errors = false
ignore_missing_imports = true
implicit_reexport = true
local_partial_types = true
strict_optional = true
strict_equality = true
no_implicit_optional = true
warn_unused_ignores = true
warn_unreachable = true
warn_no_return = true

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"
